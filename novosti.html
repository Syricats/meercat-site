function dayIndex(){
  var now = new Date();
  var start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / 86400000);
}
function fmt(d){
  var p = d.split('-');
  var months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return +p[2] + ' ' + months[(+p[1]) - 1] + ' ' + p[0];
}

/* факт дня */
(function factOfDay(){
  var idx = dayIndex() % FACTS.length;
  var today = new Date().toISOString().slice(0, 10);
  document.getElementById('factText').textContent = FACTS[idx];
  document.getElementById('factDate').textContent = fmt(today);
})();

function render(items){
  var host = document.getElementById('list');
  if (!items || !items.length){
    host.innerHTML = '<div class="empty">Новостей пока нет — сурикат копает.</div>';
    return;
  }
  items.sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  host.innerHTML = items.map(function(it){
    var p = it.date.split('-');
    var months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    return '<article class="item">' +
      '<div class="date"><b>' + (+p[2]) + '</b><span>' + months[(+p[1]) - 1] + '</span></div>' +
      '<div class="body">' +
        '<span class="chip ' + (it.tag || 'сайт') + '">' + (it.tag || 'сайт') + '</span>' +
        '<h3>' + it.title + '</h3>' +
        '<p>' + it.text + '</p>' +
      '</div></article>';
  }).join('');
}

fetch('news.json?t=' + Date.now(), { cache: 'no-store' })
  .then(function(r){ if (!r.ok) throw new Error('no file'); return r.json(); })
  .then(function(data){ render(data); })
  .catch(function(){ render(FALLBACK); });
