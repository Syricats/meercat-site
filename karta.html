<style>
  :root{ --ink:#0e1a24; --paper:#fff6e2; --accent:#c8641f; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;background:#0e1a24}
  #map{position:fixed;inset:0}

  .top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;
    padding:10px 12px;pointer-events:none;background:linear-gradient(180deg,rgba(14,26,36,.72),rgba(14,26,36,0))}
  .top a{pointer-events:auto;text-decoration:none;color:#fff6e2;font-weight:800;font-size:12.5px;
    background:rgba(18,32,40,.66);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 13px;
    backdrop-filter:blur(8px)}
  .top a.on{background:#ffcc5c;color:#3a2405;border-color:#ffcc5c}
  .top .spacer{flex:1}

  .hintbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;
    background:rgba(18,32,40,.78);color:#fff6e2;font-size:11.5px;padding:8px 15px;border-radius:999px;
    border:1px solid rgba(255,255,255,.18);pointer-events:none;white-space:nowrap}

  /* пасхалка: глобус */
  .globe{position:fixed;right:14px;bottom:56px;z-index:25;width:104px;height:104px;border-radius:50%;
    cursor:pointer;border:2px solid rgba(255,255,255,.35);
    box-shadow:0 10px 28px rgba(0,0,0,.45), inset 0 0 30px rgba(0,0,0,.4);
    background:radial-gradient(circle at 35% 30%, #2a4a63, #0b1620);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:transform .18s, box-shadow .18s}
  .globe:hover{transform:scale(1.06);box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 0 3px rgba(255,204,92,.5)}
  .globe canvas{width:100%;height:100%;display:block}
  .globe .tip{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
    font-size:10px;color:#fff6e2;background:rgba(18,32,40,.82);padding:3px 8px;border-radius:999px;
    white-space:nowrap;opacity:0;transition:.2s;pointer-events:none}
  .globe:hover .tip{opacity:1}

  .maplibregl-ctrl-attrib{font-size:10px;opacity:.85}
  @media (max-width:560px){
    .top{padding:8px 8px;gap:5px}
    .top a{padding:6px 9px;font-size:11.5px}
    .top a:first-child{display:none}
    .globe{width:74px;height:74px;right:10px;bottom:70px}
    .hintbar{display:none}
    .maplibregl-ctrl-bottom-left{bottom:8px}
  }

  /* компактная верхняя панель на телефоне */
  @media(max-width:480px){
    header .nav,header .navlinks{height:56px;gap:6px}
    header .brand img{width:26px;height:26px}
    header .brand span{display:none}
    header .navlinks,header .subnav{gap:4px}
    header .navlinks a,header .subnav a{padding:6px 7px;font-size:11px;border-radius:10px}
  }
  header .nav,header .navlinks{overflow-x:auto;scrollbar-width:none}
  header .nav::-webkit-scrollbar,header .navlinks::-webkit-scrollbar{display:none}
</style>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
}}
</script>

<script type="module">
import * as THREE from 'three';
const maplibregl = window.maplibregl;

/* ---------- карта ---------- */
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [23.0, -24.5],
  zoom: 3.1,
  attributionControl: true
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-left');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 90, unit: 'metric' }), 'bottom-left');

const PLACES = [
  { lng: 23.0, lat: -23.5, title: 'Калахари', text: 'Полупустыня на юге Африки — главный дом сурикатов.' },
  { lng: 20.5, lat: -25.7, title: 'Кгалагади', text: 'Национальный парк на границе ЮАР и Ботсваны, где начались наблюдения за колониями.' },
  { lng: 21.8, lat: -26.9, title: 'Kuruman River Reserve', text: 'Здесь работает Kalahari Research Centre: сурикатов наблюдают каждый день с 1990-х.' }
];

PLACES.forEach(p => {
  const el = document.createElement('div');
  el.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#c8641f;border:3px solid #fff6e2;' +
    'box-shadow:0 0 0 6px rgba(200,100,31,.25);cursor:pointer';
  new maplibregl.Marker({ element: el })
    .setLngLat([p.lng, p.lat])
    .setPopup(new maplibregl.Popup({ offset: 16, closeButton: false })
      .setHTML('<b>' + p.title + '</b><br><span style="font-size:12px">' + p.text + '</span>'))
    .addTo(map);
});

/* ---------- пасхалка: маленький глобус ---------- */
const host = document.getElementById('globe');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(host.clientWidth, host.clientHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 20);
cam.position.set(0, 0.35, 3.1);
cam.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.7);
sun.position.set(2.5, 1.6, 2.2);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8fc6ff, 0.7);
rim.position.set(-2.4, -1.2, -1.8);
scene.add(rim);

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 48, 32),
  new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load(EARTH_TEX), roughness: 0.85, metalness: 0 })
);
globe.rotation.z = 0.2;
scene.add(globe);

/* точка «Калахари» на глобусе */
const dot = new THREE.Mesh(
  new THREE.SphereGeometry(0.045, 12, 10),
  new THREE.MeshBasicMaterial({ color: 0xffb347 })
);
(function place(){
  const lat = -23.5 * Math.PI / 180, lon = 23.0 * Math.PI / 180;
  dot.position.set(Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)).multiplyScalar(1.005);
  globe.add(dot);
})();

function fit(){
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
}
fit();
addEventListener('resize', fit);

let t0 = performance.now();
function spin(){
  requestAnimationFrame(spin);
  const t = (performance.now() - t0) / 1000;
  globe.rotation.y = t * 0.32 + 2.2;      // Африка развёрнута к зрителю
  renderer.render(scene, cam);
}
spin();

host.addEventListener('click', () => { location.href = 'afrika.html'; });
</script>
