<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Где живут сурикаты — карта</title>
<meta name="description" content="Рисованная карта Африки: где живут сурикаты, пустыни, Калахари и место исследований.">
<meta name="theme-color" content="#f3e2c0">
<link rel="icon" href="img/favicon.png">
<style>
  :root{
    --sand:#f6e7c6; --sand2:#efd9ad; --ink:#3b2a1c; --ink2:#6b5540;
    --sea1:#8fc6d8; --sea2:#6fb3cc; --line:rgba(90,70,40,.22);
    --accent:#c8641f; --accent2:#8f4413;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0f1a22;color:var(--ink);overflow:hidden;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:
      radial-gradient(900px 600px at 60% 40%, #a9d6e4, #6fb3cc 55%, #4e93b0 100%);
    touch-action:none;cursor:grab}
  #stage.drag{cursor:grabbing}
  svg#map{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;will-change:transform}

  /* вода */
  .sea-wave{opacity:.18}

  /* шапка */
  .top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:12px 14px;pointer-events:none;background:linear-gradient(180deg,rgba(13,26,34,.55),rgba(13,26,34,0))}
  .top a{pointer-events:auto;text-decoration:none;color:#fff6e2;font-weight:800;font-size:13px;
    background:rgba(18,32,40,.6);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 14px}
  .top a.on{background:#ffcc5c;color:#3a2405;border-color:#ffcc5c}

  .card{position:fixed;left:14px;top:64px;z-index:20;max-width:min(330px,78vw);
    background:rgba(255,250,238,.94);border:2px solid rgba(90,70,40,.25);border-radius:16px;
    padding:13px 15px;box-shadow:0 14px 34px rgba(20,40,50,.35)}
  .card h1{font-size:18px;line-height:1.15;margin-bottom:4px}
  .card h1 span{color:var(--accent2)}
  .card p{font-size:12px;color:var(--ink2);line-height:1.45}
  .legend{margin-top:9px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink2)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}

  .zoom{position:fixed;right:14px;bottom:14px;z-index:20;display:flex;flex-direction:column;gap:7px}
  .zoom button{width:44px;height:44px;border-radius:13px;border:2px solid rgba(90,70,40,.25);
    background:rgba(255,250,238,.95);color:var(--ink);font-size:19px;font-weight:900;cursor:pointer;
    box-shadow:0 6px 16px rgba(20,40,50,.25)}
  .zoom button:active{transform:translateY(1px)}

  .tip{position:fixed;left:14px;bottom:14px;z-index:20;
    background:rgba(18,32,40,.72);color:#fff6e2;font-size:11.5px;padding:8px 14px;border-radius:999px;
    border:1px solid rgba(255,255,255,.18);pointer-events:none}

  .meerkat{display:none}

  @media (max-width:520px){
    .card{left:10px;top:58px;padding:10px 12px}
    .card h1{font-size:16px}
    .card p{font-size:11px}
    .tip{display:none}
    .meerkat{width:52px;bottom:70px}
  }

  /* компактная верхняя панель на телефоне */
  @media(max-width:480px){
    header .nav,header .navlinks{height:56px;gap:6px}
    header .brand img{width:26px;height:26px}
    header .brand span{display:none}
    header .navlinks,header .subnav{gap:4px}
    header .navlinks a,header .subnav a{padding:6px 7px;font-size:11px;border-radius:10px}
  }
  header .nav,header .navlinks{overflow-x:auto;scrollbar-width:none}
  header .nav::-webkit-scrollbar,header .navlinks::-webkit-scrollbar{display:none}
</style>
</head>
<body>

<div id="stage">
  <svg id="map" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid meet">
    <defs>
      <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="#a8541a" stroke-width="2" opacity=".22"/>
      </pattern>
      <radialGradient id="saharaGrad" cx="50%" cy="50%" r="60%">
        <stop offset="0" stop-color="#f0c987" stop-opacity=".95"/>
        <stop offset="1" stop-color="#e8b877" stop-opacity=".1"/>
      </radialGradient>
      <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f2dfb4"/><stop offset="1" stop-color="#e6cb9a"/>
      </linearGradient>
    </defs>

    <g id="waves"></g>
    <g id="land"></g>
    <g id="deserts"></g>
    <g id="points"></g>
  </svg>
</div>

<header class="top">
  <a href="karta.html">← Карта мира</a>
  <a href="index.html">На главную</a>
</header>

<div class="card">
  <h1>Где живут <span>сурикаты</span></h1>
  <p>Юг Африки: ЮАР, Ботсвана, Намибия, юг Анголы и Зимбабве. Пустыня Калахари —
  самое известное место, где за сурикатами наблюдают учёные.</p>
  <div class="legend">
    <span><i style="background:#d9a24a"></i>ареал сурикатов</span>
    <span><i style="background:#f0c987"></i>пустыни</span>
    <span><i style="background:#c8641f;border-radius:50%"></i>точки на карте</span>
  </div>
</div>

<div class="zoom">
  <button id="zin">+</button>
  <button id="zout">−</button>
  <button id="zreset">⟲</button>
</div>

<div class="tip">Тяни карту · колесо или два пальца — приблизить</div>

  const x = (lon - B.lon0) / (B.lon1 - B.lon0) * 900;
  const y = (B.lat1 - lat) / (B.lat1 - B.lat0) * 900;
  return [x, y];
}

/* ---------- волны в океане ---------- */
(function waves(){
  const g = document.getElementById('waves');
  let s = '';
  for (let i = 0; i < 46; i++){
    const y = 20 + i * 19;
    const amp = 4 + (i % 3) * 2;
    let d = 'M -60 ' + y;
    for (let x = -60; x < 980; x += 60){
      d += ' q 15 ' + (-amp) + ' 30 0 q 15 ' + amp + ' 30 0';
    }
    s += '<path d="' + d + '" stroke="#ffffff" stroke-width="1.6" fill="none" class="sea-wave"/>';
  }
  g.innerHTML = s;
})();

/* ---------- суша ---------- */
(function land(){
  const g = document.getElementById('land');
  let s = '';
  AFRICA.forEach((c, i) => {
    const fill = c.in ? '#e0a75c' : (i % 2 ? '#f3e3bd' : '#efdcb0');
    c.p.forEach(ring => {
      const pts = ring.map(([lon, lat]) => proj(lon, lat));
      if (pts.length < 3) return;
      const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + ' Z';
      s += '<path d="' + d + '" fill="' + fill + '" stroke="#b8965f" stroke-width="1" stroke-linejoin="round"/>';
      if (c.in) s += '<path d="' + d + '" fill="url(#hatch)" stroke="none"/>';
    });
  });
  g.innerHTML = s;
})();

/* ---------- зум и панорама ---------- */
const stage = document.getElementById('stage');
const svg = document.getElementById('map');
let scale = 1, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0;

function apply(){
  svg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
}
function clamp(){
  const w = stage.clientWidth, h = stage.clientHeight;
  const maxX = (scale - 1) * w, maxY = (scale - 1) * h;
  tx = Math.min(0, Math.max(-maxX, tx));
  ty = Math.min(0, Math.max(-maxY, ty));
}
function zoomAt(cx, cy, factor){
  const ns = Math.min(9, Math.max(1, scale * factor));
  const k = ns / scale;
  tx = cx - (cx - tx) * k;
  ty = cy - (cy - ty) * k;
  scale = ns;
  clamp(); apply();
}

stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

stage.addEventListener('pointerdown', e => {
  dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
  stage.classList.add('drag');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  tx = e.clientX - sx; ty = e.clientY - sy;
  clamp(); apply();
});
stage.addEventListener('pointerup', () => { dragging = false; stage.classList.remove('drag'); });
stage.addEventListener('pointercancel', () => { dragging = false; stage.classList.remove('drag'); });

/* два пальца — зум */
let pinch = null;
stage.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    pinch = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), s: scale };
  }
}, { passive: true });
stage.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch){
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const target = Math.min(9, Math.max(1, pinch.s * (d / pinch.d)));
    zoomAt(cx, cy, target / scale);
  }
}, { passive: true });
stage.addEventListener('touchend', () => { pinch = null; }, { passive: true });

document.getElementById('zin').onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.3);
document.getElementById('zout').onclick = () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.3);
document.getElementById('zreset').onclick = () => { scale = 1; tx = 0; ty = 0; apply(); };
apply();
</script>
