name: Новость дня

on:
  schedule:
    - cron: "0 6 * * *"      # каждый день в 06:00 UTC = 09:00 по Москве
  workflow_dispatch:          # можно запустить руками из вкладки Actions

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Добавить новость дня
        run: |
          python3 - <<'PY'
          import json, os, datetime

          news_path = "news.json"
          facts_path = "facts.json"

          news = []
          if os.path.exists(news_path):
              with open(news_path, encoding="utf-8") as f:
                  news = json.load(f)

          facts = []
          if os.path.exists(facts_path):
              with open(facts_path, encoding="utf-8") as f:
                  facts = json.load(f)

          today = datetime.date.today().isoformat()

          # сегодняшняя заметка уже есть — второй раз не добавляем
          if any(item.get("tag") == "сурикат" and item.get("date") == today for item in news):
              print("Заметка на сегодня уже есть:", today)
              raise SystemExit(0)

          if not facts:
              print("Архив закончился — добавлять нечего")
              raise SystemExit(0)

          fact = facts.pop(0)

          news.insert(0, {
              "date": today,
              "tag": "сурикат",
              "text": fact
          })

          # держим файл новостей компактным
          news = news[:120]

          with open(news_path, "w", encoding="utf-8") as f:
              json.dump(news, f, ensure_ascii=False, indent=2)
              f.write("\n")

          with open(facts_path, "w", encoding="utf-8") as f:
              json.dump(facts, f, ensure_ascii=False, indent=1)
              f.write("\n")

          print("Добавлено:", today, "| в архиве осталось:", len(facts))
          PY

      - name: Закоммитить изменения
        run: |
          git config user.name "meercat-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain news.json facts.json)" ]; then
            git add news.json facts.json
            git commit -m "Новость дня: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Нечего коммитить"
          fi
