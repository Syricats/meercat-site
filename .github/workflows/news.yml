name: Новость дня

on:
  schedule:
    - cron: "0 6 * * *"      # каждый день в 06:00 UTC = 09:00 по Москве
  workflow_dispatch:          # можно запустить руками из вкладки Actions

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Добавить новость дня
        run: |
          python3 - <<'PY'
          import json, os, datetime

          FACTS = [
            "Сурикат — единственное животное, которое умеет смотреть вдаль с чувством собственного достоинства.",
            "Если сурикат встал столбиком и молчит — он не медитирует, он вас оценивает.",
            "Сурикат спит 10 часов, а выглядит так, будто не спал неделю.",
            "Сурикаты не храпят, но могут тявкнуть во сне — на всякий случай.",
            "Детёныш суриката пытается копать там, где уже есть нора. Получается ямка в норе.",
            "Сурикат может отвернуться от еды, если еда недостаточно интересная.",
            "Скорпион для суриката — не ужас, а хрустящий перекус.",
            "Сурикаты дерутся за место у окна в норе — как в маршрутке.",
            "Главная самка в колонии решает всё, кроме погоды.",
            "Сурикат-часовой любит думать, что от него зависит мир. Иногда так и есть.",
            "Если сурикат смотрит на вас и жуёт — он нашёл что-то вкуснее вашего разговора.",
            "Сурикат бегает зигзагом не от страха, а из вредности.",
            "Сурикаты обнимаются мордами — это их способ сказать «свои».",
            "Детёныши сурикатов играют в «кто первый упадёт с камня».",
            "Сурикат не умеет выглядеть виноватым, но очень старается.",
            "У суриката четыре пальца, а важности — на восемь.",
            "Сурикаты не любят, когда их фотографируют снизу.",
            "Любой сурикат уверен, что он главный. Статистически правы единицы.",
            "Сурикат, поевший скорпиона, ходит с видом победителя.",
            "Сурикаты не умеют шептать, но очень стараются.",
            "Если сурикат лёг на спину — либо жара, либо он сдался.",
            "Сурикат может проигнорировать слона, но не жука.",
            "Детёныш суриката считает, что нора — это лифт.",
            "Сурикаты копают даже в песке, который сами же и насыпали.",
            "Сурикат никогда не признается, что застрял в норе.",
            "У суриката плохое настроение выглядит как «сейчас лягу».",
            "Сурикаты умеют ждать. Очень. Долго. Около минуты.",
            "Сурикат-подросток проверяет границы дозволенного там, где не надо.",
            "Сурикаты считают, что тень от человека — тоже хищник.",
            "Сурикат, укравший еду, выглядит невиннее всех.",
            "Детёныши сурикатов кусают всё, включая воздух.",
            "Сурикат может спать на спине, но потом не помнит, как.",
            "Сурикаты не умеют драться красиво: только быстро и обидно.",
            "Если сурикату скучно, он копает. Если очень скучно — копает яму.",
            "Сурикат уверен, что его хвост — самостоятельный организм.",
            "Сурикат смотрит на закат так, будто это его закат.",
            "Сурикаты умеют делать вид, что не слышали.",
            "Сурикат-нянька — самая недовольная должность в колонии.",
            "Детёныш суриката учится стоять столбиком и падает вбок.",
            "Сурикат при виде змеи сначала возмущается, потом действует.",
            "Сурикаты не любят делиться, но делают это с достоинством.",
            "Сурикат может не спать всю ночь, если ему что-то показалось.",
            "У суриката нет карманов, но есть щёки.",
            "Сурикаты прячут еду в щеках и потом забывают, где она.",
            "Сурикат на посту не ест. Теоретически.",
            "Детёныши сурикатов пищат громче, чем нужно, — на всякий случай.",
            "Сурикат может задуматься на полдороге к норе.",
            "Сурикаты любят тёплый камень больше, чем приключения.",
            "Сурикат уверен, что если он замер — его не видно.",
            "Сурикат, упавший в нору, делает вид, что так и планировал.",
            "Сурикаты умеют смотреть с укором без слов.",
            "Детёныш суриката боится пыли, но лезет в самый центр пыли.",
            "Все сурикаты считают себя фотогеничными.",
            "Сурикат может укусить подушку, если подушка подозрительная.",
            "Сурикаты не поют, но издают звуки, которые лучше некоторых песен.",
            "Сурикат-часовой оглядывается по сторонам, даже когда смотрит на вас.",
            "Сурикат не любит дождь и считает его личным оскорблением.",
            "Сурикаты переворачивают камни камнями. Наука в действии.",
            "Детёныш суриката бегает за собственной тенью до изнеможения.",
            "Сурикат может выглядеть мудрым, даже когда просто задумался, где еда.",
            "Сурикат-дедушка говорит всё быстрее всех. Только о прошлом.",
            "Сурикаты не устают копать. Они устают не копать.",
            "Если сурикат сидит и смотрит в одну точку, там точно что-то есть.",
            "Сурикат и жук — это целый сюжет.",
            "Сурикат никогда не ест молча, если рядом есть кто-то голодный.",
            "Сурикат способен обидеться на палку.",
            "Детёныши сурикатов учатся кусаться на взрослых. Взрослые терпят.",
            "Сурикат считает, что если он моргнул — опасность прошла.",
            "Сурикат может копать вверх. Это не помогает, но он пытается.",
            "Сурикат с едой в зубах всегда выглядит занятым.",
            "Сурикат из соседней колонии — всегда подозрительный сурикат.",
            "Сурикат-вожак не ходит быстро, но идёт первым.",
            "Сурикаты не умеют уставать на камеру.",
            "Детёныш суриката пугается собственного чиха.",
            "Сурикат выглядит так, будто знает что-то, чего не знаете вы. Обычно это «где жук».",
            "Сурикат может не хотеть играть, но хочет, чтобы его позвали.",
            "Сурикаты считаются милыми, пока не откроют рот.",
            "Сурикат умеет стоять у ночных огней и думать о своём.",
            "Сурикат никогда не проигрывает в гляделки: у него есть полёт фантазии.",
            "Детёныш суриката уверен, что мама вернётся через секунду. Через секунду.",
            "Сурикат может провести полдня, наблюдая за одним жуком.",
            "Сурикат не любит незнакомые запахи и любит знакомые до неприличия.",
            "Сурикат спит так, будто его кто-то обязан разбудить.",
            "Сурикат может сделать вид, что не он уронил камень.",
            "Сурикат умеет выглядеть как маленький директор большого парка.",
            "Сурикат, который первый нашёл жука, всегда врёт о размере жука.",
            "Сурикаты не умеют тихо радоваться.",
            "Сурикат может задуматься о вечном ровно четыре секунды.",
          ]

          path = "news.json"
          data = []
          if os.path.exists(path):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)

          today = datetime.date.today().isoformat()

          # если новость дня уже есть — второй раз не добавляем
          if any(item.get("tag") == "факт" and item.get("date") == today for item in data):
              print("Новость дня уже есть:", today)
              raise SystemExit(0)

          # факт выбираем по номеру дня в году, чтобы он менялся каждый день
          day = datetime.date.today().timetuple().tm_yday
          fact = FACTS[day % len(FACTS)]

          data.insert(0, {
              "date": today,
              "tag": "факт",
              "title": "Факт дня",
              "text": fact
          })

          # держим файл компактным: 60 последних записей
          data = data[:60]

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Добавлено:", today, fact[:40])
          PY

      - name: Закоммитить изменения
        run: |
          git config user.name "meercat-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain news.json)" ]; then
            git add news.json
            git commit -m "Новость дня: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Нечего коммитить"
          fi
