          path = "news.json"
          data = []
          if os.path.exists(path):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)

          today = datetime.date.today().isoformat()

          # если новость дня уже есть — второй раз не добавляем
          if any(item.get("tag") == "факт" and item.get("date") == today for item in data):
              print("Новость дня уже есть:", today)
              raise SystemExit(0)

          # факт выбираем по номеру дня в году, чтобы он менялся каждый день
          day = datetime.date.today().timetuple().tm_yday
          fact = FACTS[day % len(FACTS)]

          data.insert(0, {
              "date": today,
              "tag": "факт",
              "title": "Факт дня",
              "text": fact
          })

          # держим файл компактным: 60 последних записей
          data = data[:60]

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Добавлено:", today, fact[:40])
          PY

      - name: Закоммитить изменения
        run: |
          git config user.name "meercat-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain news.json)" ]; then
            git add news.json
            git commit -m "Новость дня: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Нечего коммитить"
          fi
