name: Новость дня

on:
  schedule:
    - cron: "0 6 * * *"      # каждый день в 06:00 UTC = 09:00 по Москве
  workflow_dispatch:          # можно запустить руками из вкладки Actions

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Добавить новость дня
        run: |
          python3 - <<'PY'
          import json, os, datetime

          FACTS = [
            "Сурикаты живут колониями до 30 зверей и всегда ставят кого-то «наверх» — сторожить небо.",
            "Тёмные круги вокруг глаз суриката нужны не от недосыпа, а чтобы солнце не слепило.",
            "Сурикаты стоят на задних лапах часами: так они видят хищника за сотни метров.",
            "За день сурикат съедает примерно столько же, сколько весит сам.",
            "У сурикатов есть «дежурные няньки»: пока все копают, кто-то сидит с детёнышами.",
            "Сурикаты различают друг друга по голосу и зовут своих особыми звуками.",
            "Ядовитые насекомые для суриката — обычная еда.",
            "Нора суриката — лабиринт с десятками входов и отдельными «спальнями».",
            "Перед выходом из норы сурикат сначала высовывает голову и осматривается.",
            "Сурикаты узнают тень хищной птицы быстрее, чем саму птицу.",
            "Детёныши рождаются слепыми, но через месяц уже копают.",
            "Сурикат может не пить неделями: влагу берёт из еды.",
            "Колония выставляет «смену караула» каждые несколько часов.",
            "Сурикаты греются на солнце, вытянувшись столбиком.",
            "Короткий лай суриката — сигнал опасности для всей колонии.",
            "Сурикаты чистят друг другу шерсть — это про дружбу, а не про гигиену.",
            "Сурикат бежит до 30 км/ч, но короткими перебежками.",
            "Вход в нору сурикаты делают выше выхода — чтобы не затекала вода.",
            "Молодые сурикаты учатся охоте, играя с жуками и ящерицами.",
            "Сурикат — не сурок и не мангуст, хотя их постоянно путают.",
            "В колонии есть главная самка: она решает, когда переезжать.",
            "Сурикаты спят клубком по 10–12 зверей в одной норе.",
            "Сурикат узнаёт себя в зеркале — редкость среди мелких хищников.",
            "Хвост суриката работает балансиром, когда он стоит столбиком.",
            "Сурикаты не любят дождь: мокрая шерсть плохо держит тепло.",
            "Если нора занята чужими, сурикаты просто выкапывают новую рядом.",
            "Сурикаты ставят «наверх» самого внимательного, а не самого сильного.",
            "У сурикатов есть устойчивость к яду скорпионов и змей.",
            "Детёнышам приносят «учебных» насекомых: сначала мёртвых, потом живых.",
            "Сурикаты узнают членов семьи даже после долгой разлуки."
          ]

          path = "news.json"
          data = []
          if os.path.exists(path):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)

          today = datetime.date.today().isoformat()

          # если новость дня уже есть — второй раз не добавляем
          if any(item.get("tag") == "факт" and item.get("date") == today for item in data):
              print("Новость дня уже есть:", today)
              raise SystemExit(0)

          # факт выбираем по номеру дня в году, чтобы он менялся каждый день
          day = datetime.date.today().timetuple().tm_yday
          fact = FACTS[day % len(FACTS)]

          data.insert(0, {
              "date": today,
              "tag": "факт",
              "title": "Факт дня",
              "text": fact
          })

          # держим файл компактным: 60 последних записей
          data = data[:60]

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Добавлено:", today, fact[:40])
          PY

      - name: Закоммитить изменения
        run: |
          git config user.name "meercat-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain news.json)" ]; then
            git add news.json
            git commit -m "Новость дня: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Нечего коммитить"
          fi
